name: Build Geode Mod (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: false
      - uses: actions/upload-artifact@v4
        with:
          name: geode-macOS
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
